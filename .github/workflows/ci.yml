name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# GitHub-hosted runners only (ubuntu-latest, Node 26).
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm test
  forbidden-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan history and tree (counts only, the list is never printed)
        env:
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
        run: |
          list="$RUNNER_TEMP/forbidden.txt"
          printf '%s\n' "$FORBIDDEN_STRINGS" | grep -v '^$' > "$list" || true
          test -s "$list" || { echo "FORBIDDEN_STRINGS secret is empty"; exit 1; }
          hist=$(git log -p --all | grep -cF -f "$list" || true)
          tree=$(git grep -l -F -f "$list" -- . || true)
          tree_count=$(printf '%s' "$tree" | grep -c . || true)
          echo "history hits: $hist"
          echo "tree files with hits: $tree_count"
          test "$hist" = "0" && test "$tree_count" = "0"
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSLO "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSLO "$base/gitleaks_8.30.1_checksums.txt"
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xz -f gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan history
        run: ./gitleaks detect --source . --redact --no-banner
